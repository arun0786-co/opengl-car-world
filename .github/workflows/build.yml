name: build

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libglew-dev libglfw3-dev zlib1g-dev xvfb libgl1-mesa-dri
      - name: build
        run: make -j4
      - name: test
        run: make test
      - name: render one frame with software opengl
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./car_world --shot frame.png --camera 8 --sun 0.3 --seconds 2 --drive 3
          xvfb-run -a -s "-screen 0 1280x720x24" ./car_world --bench 30 --camera 8 --sun 0.3
      - uses: actions/upload-artifact@v4
        with:
          name: frame
          path: frame.png

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: brew install glew glfw
      - name: build
        run: make -j4
      - name: test
        run: make test
